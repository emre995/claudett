name: BalanceApp
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"

targets:
  BalanceApp:
    type: application
    platform: iOS
    sources:
      - Sources/BalanceApp
    info:
      path: Sources/BalanceApp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Balance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.balanceapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
